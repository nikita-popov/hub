name: nikita-popov/radicale-scan
description: "Radicale path scan — non-CalDAV paths probed"
type: leaky
filter: >
  evt.Meta.service == 'radicale' &&
  evt.Meta.log_type == 'request' &&
  (evt.Meta.http_path contains '.php' ||
   evt.Meta.http_path contains 'wp-' ||
   evt.Meta.http_path contains '/admin' ||
   evt.Meta.http_path contains '/shell')
groupby: "evt.Meta.src_ip"
capacity: 3
leakspeed: "30s"
blackhole: 10m
labels:
  service: radicale
  type: scan
  remediation: true
