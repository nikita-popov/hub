filter: "evt.Line.Labels.type == 'radicale'"
name: nikita-popov/radicale-logs
description: "Parse Radicale CalDAV/CardDAV server logs (file or journald)"
author: nikita-popov
onsuccess: next_stage

nodes:
  # Proxied request with User-Agent (most specific first)
  - filter: "evt.Line.Raw contains 'request for' && evt.Line.Raw contains 'forwarded for' && evt.Line.Raw contains 'using'"
    grok:
      pattern: "(?:%{SYSLOGTIMESTAMP:timestamp} \\S+ \\S+: )?\\[%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] %{WORD:http_method} request for '%{DATA:http_path}' received from %{IP:src_ip} \\(forwarded for '%{IP:real_ip}'\\) using '%{DATA:useragent_raw}'"
      apply_on: Line.Raw
    stash:
      - name: radicale_request_ip
        key: "evt.Parsed.pid + '/' + evt.Parsed.thread"
        value: evt.Parsed.real_ip
        ttl: 30s
        size: 1000
    statics:
      - meta: log_type
        value: http_request
      - meta: source_ip
        expression: evt.Parsed.real_ip
      - meta: http_path
        expression: evt.Parsed.http_path
      - meta: useragent
        expression: evt.Parsed.useragent_raw

  # Proxied request without User-Agent
  - filter: "evt.Line.Raw contains 'request for' && evt.Line.Raw contains 'forwarded for' && !(evt.Line.Raw contains 'using')"
    grok:
      pattern: "(?:%{SYSLOGTIMESTAMP:timestamp} \\S+ \\S+: )?\\[%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] %{WORD:http_method} request for '%{DATA:http_path}' received from %{IP:src_ip} \\(forwarded for '%{IP:real_ip}'\\)"
      apply_on: Line.Raw
    stash:
      - name: radicale_request_ip
        key: "evt.Parsed.pid + '/' + evt.Parsed.thread"
        value: evt.Parsed.real_ip
        ttl: 30s
        size: 1000
    statics:
      - meta: log_type
        value: http_request
      - meta: source_ip
        expression: evt.Parsed.real_ip
      - meta: http_path
        expression: evt.Parsed.http_path

  # Direct request with User-Agent
  - filter: "evt.Line.Raw contains 'request for' && !(evt.Line.Raw contains 'forwarded for') && evt.Line.Raw contains 'using'"
    grok:
      pattern: "(?:%{SYSLOGTIMESTAMP:timestamp} \\S+ \\S+: )?\\[%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] %{WORD:http_method} request for '%{DATA:http_path}' received from %{IP:src_ip} using '%{DATA:useragent_raw}'"
      apply_on: Line.Raw
    stash:
      - name: radicale_request_ip
        key: "evt.Parsed.pid + '/' + evt.Parsed.thread"
        value: evt.Parsed.src_ip
        ttl: 30s
        size: 1000
    statics:
      - meta: log_type
        value: http_request
      - meta: source_ip
        expression: evt.Parsed.src_ip
      - meta: http_path
        expression: evt.Parsed.http_path
      - meta: useragent
        expression: evt.Parsed.useragent_raw

  # Direct request without User-Agent
  - filter: "evt.Line.Raw contains 'request for' && !(evt.Line.Raw contains 'forwarded for') && !(evt.Line.Raw contains 'using')"
    grok:
      pattern: "(?:%{SYSLOGTIMESTAMP:timestamp} \\S+ \\S+: )?\\[%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] %{WORD:http_method} request for '%{DATA:http_path}' received from %{IP:src_ip}"
      apply_on: Line.Raw
    stash:
      - name: radicale_request_ip
        key: "evt.Parsed.pid + '/' + evt.Parsed.thread"
        value: evt.Parsed.src_ip
        ttl: 30s
        size: 1000
    statics:
      - meta: log_type
        value: http_request
      - meta: source_ip
        expression: evt.Parsed.src_ip
      - meta: http_path
        expression: evt.Parsed.http_path

  # Access denied
  - filter: "evt.Line.Raw contains 'denied for'"
    grok:
      pattern: "(?:%{SYSLOGTIMESTAMP:timestamp} \\S+ \\S+: )?\\[%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] Access to '%{DATA:http_path}' denied for %{GREEDYDATA:auth_user}"
      apply_on: Line.Raw
    statics:
      - meta: log_type
        value: http_denied
      - meta: http_path
        expression: evt.Parsed.http_path
      - meta: source_ip
        expression: "GetFromStash('radicale_request_ip', evt.Parsed.pid + '/' + evt.Parsed.thread)"

  # Response with HTTP status code
  - filter: "evt.Line.Raw contains 'response status'"
    grok:
      pattern: "(?:%{SYSLOGTIMESTAMP:timestamp} \\S+ \\S+: )?\\[%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] %{WORD:http_method} response status for '%{DATA:http_path}' in %{NUMBER:duration} seconds: %{INT:http_status}"
      apply_on: Line.Raw
    statics:
      - meta: log_type
        value: http_response
      - meta: http_status
        expression: evt.Parsed.http_status
      - meta: http_path
        expression: evt.Parsed.http_path
      - meta: source_ip
        expression: "GetFromStash('radicale_request_ip', evt.Parsed.pid + '/' + evt.Parsed.thread)"

statics:
  - meta: service
    value: radicale
  - target: evt.StrTime
    expression: evt.Parsed.timestamp
