filter: "evt.Parsed.program == 'radicale'"
name: nikita-popov/radicale-logs
description: "Parse Radicale CalDAV/CardDAV server logs (syslog)"
author: nikita-popov
onsuccess: next_stage

nodes:
  - filter: "evt.Parsed.message contains 'request for' && evt.Parsed.message contains 'forwarded for' && evt.Parsed.message contains 'using'"
    grok:
      pattern: "%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] %{WORD:http_method} request for '%{DATA:http_path}' received from %{IP:src_ip} %{DATA} '%{IP:real_ip}' using '%{DATA:useragent_raw}'"
      expression: "evt.Parsed.message"
    statics:
      - meta: log_type
        value: http_request
      - meta: source_ip
        expression: evt.Parsed.real_ip
      - meta: useragent
        expression: evt.Parsed.useragent_raw

  - filter: "evt.Parsed.message contains 'request for' && evt.Parsed.message contains 'forwarded for'"
    grok:
      pattern: "%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] %{WORD:http_method} request for '%{DATA:http_path}' received from %{IP:src_ip} %{DATA} '%{IP:real_ip}'"
      expression: "evt.Parsed.message"
    statics:
      - meta: log_type
        value: http_request
      - meta: source_ip
        expression: evt.Parsed.real_ip

  - filter: "evt.Parsed.message contains 'request for' && !(evt.Parsed.message contains 'forwarded for') && evt.Parsed.message contains 'using'"
    grok:
      pattern: "%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] %{WORD:http_method} request for '%{DATA:http_path}' received from %{IP:src_ip} using '%{DATA:useragent_raw}'"
      expression: "evt.Parsed.message"
    statics:
      - meta: log_type
        value: http_request
      - meta: source_ip
        expression: evt.Parsed.src_ip
      - meta: useragent
        expression: evt.Parsed.useragent_raw

  - filter: "evt.Parsed.message contains 'request for' && !(evt.Parsed.message contains 'forwarded for')"
    grok:
      pattern: "%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] %{WORD:http_method} request for '%{DATA:http_path}' received from %{IP:src_ip}"
      expression: "evt.Parsed.message"
    statics:
      - meta: log_type
        value: http_request
      - meta: source_ip
        expression: evt.Parsed.src_ip

  - filter: "evt.Parsed.message contains 'denied for'"
    grok:
      pattern: "%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] Access to '%{DATA:http_path}' denied for %{GREEDYDATA:auth_user}"
      expression: "evt.Parsed.message"
    statics:
      - meta: log_type
        value: http_denied

  - filter: "evt.Parsed.message contains 'response status'"
    grok:
      pattern: "%{INT:pid}/%{DATA:thread}\\] \\[%{LOGLEVEL:log_level}\\] %{WORD:http_method} response status for '%{DATA:http_path}' in %{NUMBER:duration} seconds: %{INT:http_status}"
      expression: "evt.Parsed.message"
    statics:
      - meta: log_type
        value: http_response
      - meta: http_status
        expression: evt.Parsed.http_status

statics:
  - meta: service
    value: radicale
  - target: evt.StrTime
    expression: evt.Parsed.timestamp
